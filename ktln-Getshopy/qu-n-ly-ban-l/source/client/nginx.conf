server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls → backend server (internal Docker network)
    location /api/ {
        proxy_pass         http://server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # cdn.tgdd.vn chặn hotlink theo Referer (403 khi Referer là localhost). Ảnh đã được
        # mirror vào MinIO (scripts/mirror-product-images.js); DB giữ nguyên URL gốc, đổi ở đây.
        # sub_filter cần nội dung không nén nên xóa Accept-Encoding gửi lên backend.
        proxy_set_header   Accept-Encoding "";
        sub_filter_types   application/json;
        sub_filter         'https://cdn.tgdd.vn/' '/product-images/';
        sub_filter_once    off;
    }

    # Ảnh sản phẩm đã mirror: bucket công khai `product-images` trong MinIO (chỉ đọc object).
    # Resolve tên khi có request (không lúc khởi động) để nginx vẫn lên nếu MinIO chưa chạy.
    location /product-images/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $minio_upstream minio:9000;
        proxy_pass         http://$minio_upstream;
        proxy_set_header   Host minio:9000;
        proxy_connect_timeout 5s;
        expires            30d;
        add_header         Cache-Control "public";
    }

    # Proxy WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass         http://server:8080/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # SPA fallback
    # Tài nguyên có hash trong tên (index-D3Al6REy.js) — nội dung đổi thì tên
    # đổi, nên cache vĩnh viễn được, không bao giờ phục vụ nhầm bản cũ.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html KHÔNG được cache: nó là chỗ duy nhất trỏ tới bundle có hash.
        # Nếu browser giữ bản cũ thì dù đã rebuild, người dùng vẫn chạy code cũ
        # và không có cách nào biết — phải Ctrl+Shift+R thủ công.
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
