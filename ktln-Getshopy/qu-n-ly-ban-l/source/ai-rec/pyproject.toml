[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-recommendation-system"
version = "0.1.0"
description = "Collaborative Filtering and NeuMF-style Neural Collaborative Filtering baselines."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
recommendation-train = "main:main"
recommendation-api = "uvicorn:main"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "models*", "data_source*"]

[tool.unittest]
start-directory = "tests"
