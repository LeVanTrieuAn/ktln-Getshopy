version: 2

models:
  - name: mart_revenue
    description: "Doanh thu theo ngày × danh mục × thương hiệu × phương thức thanh toán. Dashboard đọc paid_revenue, KHÔNG phải gross_revenue."
    columns:
      - name: revenue_date
        tests: [not_null]
      - name: paid_revenue
        tests: [not_null]

  - name: pairs_customer_product
    description: "Bảng cơ sở: mọi cặp (khách, sản phẩm). Append-only ReplacingMergeTree — ĐỌC PHẢI KÈM FINAL. AI-Rec không đọc bảng này."
    columns:
      - name: CustomerID
        tests: [not_null]
      - name: ProductID
        tests: [not_null]
      - name: Quantity
        tests: [not_null]

  - name: processed_data_for_AI_rec
    description: "View AI-Rec đọc. Đã FINAL sẵn và đã lọc sản phẩm quá ít người mua (var min_buyers_per_product)."
    columns:
      - name: CustomerID
        tests: [not_null]
      - name: ProductID
        tests: [not_null]
      - name: Quantity
        tests: [not_null]
    # KHÔNG dùng dbt_utils.unique_combination_of_columns ở đây nữa.
    #
    # Bảng là ReplacingMergeTree append-only: mỗi lần một cặp đổi số lượng là
    # ghi thêm một dòng với updated_at mới. Cặp trùng trong bảng THÔ là đúng
    # thiết kế; chỉ sau FINAL mới được phép duy nhất. Test kia đọc bảng thô nên
    # báo lỗi ở mọi lần chạy thứ hai trở đi.
    #
    # Thay bằng test riêng đọc kèm FINAL: tests/unique_ai_rec_pair_after_final.sql

  - name: purchase_events_for_AI_rec
    description: "Lịch sử mua theo đơn cho kênh mua lại của AI-Rec. Một dòng cho mỗi (khách, món, đơn); cùng điều kiện 'một lần mua' với pairs_customer_product, không lọc ngưỡng số người mua."
    columns:
      - name: CustomerID
        tests: [not_null]
      - name: ProductID
        tests: [not_null]
      - name: OrderID
        tests: [not_null]
      - name: OrderedAt
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [CustomerID, ProductID, OrderID]

  - name: customer_product_events
    description: "Tín hiệu hành vi phụ theo (khách, món) cho ma trận hồ sơ CF. Lượt xem từ ô gợi ý tách riêng (ViewsFromRec), không tính vào Views/DwellSec."
    columns:
      - name: CustomerID
        tests: [not_null]
      - name: ProductID
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [CustomerID, ProductID]

  - name: product_features
    description: "Đặc trưng content-based (nhóm, hãng, tầm giá) của các món đại diện mỗi ô + mọi món đã bán."
    columns:
      - name: ProductID
        tests: [unique, not_null]
      - name: ParentCategory
        tests:
          - not_null
          - relationships:
              to: ref('dim_categories')
              field: category_id
      - name: PriceBand
        tests:
          - accepted_values:
              values: ['lt5', '5to15', '15to30', 'gt30']

  - name: customer_preference_signals
    description: "Sở thích onboarding dạng dài (CustomerID, Dimension, Value, Polarity) đã làm sạch."
    columns:
      - name: CustomerID
        tests: [not_null]
      - name: Dimension
        tests:
          - accepted_values:
              values: ['category', 'brand', 'price_band']
      - name: Polarity
        tests:
          - accepted_values:
              values: [1, -1]
              quote: false

  - name: catalog_features
    description: "Đặc trưng nội dung của MỌI sản phẩm đang bán (nguồn duy nhất của ParentCategory/PriceBand)."
    columns:
      - name: ProductID
        tests: [unique, not_null]
      - name: PriceBand
        tests:
          - accepted_values:
              values: ['lt5', '5to15', '15to30', 'gt30']
