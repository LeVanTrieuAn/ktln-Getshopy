version: 2

models:
  - name: mart_revenue
    description: "Doanh thu theo ngày × danh mục × thương hiệu × phương thức thanh toán. Dashboard đọc paid_revenue, KHÔNG phải gross_revenue."
    columns:
      - name: revenue_date
        tests: [not_null]
      - name: paid_revenue
        tests: [not_null]

  - name: processed_data_for_AI_rec
    description: "Tương tác khách-sản phẩm cho CF. Tên cột viết HOA theo contract với AI-rec."
    columns:
      - name: CustomerID
        tests: [not_null]
      - name: ProductID
        tests: [not_null]
      - name: Quantity
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [CustomerID, ProductID]
