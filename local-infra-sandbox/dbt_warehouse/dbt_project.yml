name: 'dbt_warehouse'
version: '1.0.0'
profile: 'dbt_warehouse'

model-paths:   ["models"]
macro-paths:   ["macros"]
seed-paths:    ["seeds"]
test-paths:    ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Tiền tố topic Kafka do Debezium đặt (topic.prefix trong connector config)
  cdc_prefix: "{{ env_var('CDC_TOPIC_PREFIX', 'cdc_prod') }}"

models:
  dbt_warehouse:
    # Kéo THẲNG từ Postgres, không qua CDC — dimension thay đổi rất ít
    masterdata:
      +materialized: table
      +schema: masterdata

    # VIEW ánh xạ parquet sang cột, không lưu gì
    staging:
      +materialized: view
      +schema: staging

    # BẢNG nạp tăng dần — không để view vì view s3() quét lại cả data lake
    warehouse:
      +materialized: incremental
      +schema: warehouse

    # Bảng gộp sẵn cho dashboard và AI-rec
    serving:
      +materialized: table
      +schema: serving

    audit:
      +materialized: table
      +schema: audit
      +tags: ['audit']
