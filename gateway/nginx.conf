# =============================================================================
# Gateway — một cổng vào cho mọi dịch vụ ứng dụng, chia theo đường dẫn
#
#   /            -> client:80           web (SPA)
#   /api/        -> server:8080/api/    API của server, giữ nguyên đường dẫn
#   /socket.io/  -> server:8080         WebSocket (giữ cho khớp nginx của client;
#                                       server hiện chưa chạy socket.io nên 404)
#   /ai-rec/     -> ai-rec:8000/        bỏ tiền tố /ai-rec   (Swagger: /ai-rec/docs)
#   /ai-bot/     -> ai-bot:3001/        bỏ tiền tố /ai-bot
#
# Các UI hạ tầng (Metabase, MinIO, ClickHouse, Kafka Connect) vẫn ở cổng riêng:
# đặt chúng dưới đường dẫn con thì phải cấu hình lại base URL của từng cái.
# =============================================================================

# Tên upstream nằm trong biến nên nginx phân giải lúc có request, qua DNS của
# Docker (127.0.0.11), chứ không phải lúc khởi động. Một dịch vụ đang dừng chỉ
# làm route của nó trả 502, không kéo cả gateway chết vì "host not found in
# upstream". Hệ quả của proxy_pass dùng biến: nginx không tự thay tiền tố đường
# dẫn, nên các route có tiền tố phải bỏ tiền tố bằng rewrite.
resolver 127.0.0.11 valid=10s ipv6=off;

# Nén response cho MỌI server bên dưới (11/11/2026). Server Node không tự nén:
# đo trên trang admin, /api/b2b/customers trả 6,96 MB JSON đi nguyên, 2,5 s. JSON
# nén gzip thường còn ~1/8–1/10. gzip_proxied any: request tới qua Tailscale nên
# nginx coi là request đã qua proxy, mặc định (off) sẽ không nén. text/event-stream
# KHÔNG nằm trong danh sách — nén thì luồng trả lời của chatbot bị gom lại.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

server {
    listen 80;
    server_name _;

    # Tìm theo ảnh gửi ảnh base64 trong body JSON; mặc định nginx chặn ở 1 MB.
    client_max_body_size 20m;

    # nginx nghe cổng 80 trong container nhưng ra ngoài là cổng 8000. Để redirect
    # tuyệt đối thì nginx ghép host với cổng 80 (tức bỏ cổng) và trình duyệt bị
    # đẩy sang http://<máy>/... sai cổng. Giữ Location tương đối.
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # ── Trang bảo trì (thêm 11/11/2026) ─────────────────────────────────────
    # Dịch vụ phía sau không trả lời (container dừng -> DNS Docker không phân giải
    # được tên, hoặc từ chối kết nối / quá giờ) thì nginx tự sinh 502/504. Trước
    # đây khi dừng hệ thống, Tailscale trả 502 RỖNG không Content-Type và trình
    # duyệt điện thoại tải về thành file .txt. Giờ: trang HTML cho người, JSON cho
    # /api (đặt error_page riêng trong các location API bên dưới).
    # KHÔNG bật proxy_intercept_errors: lỗi 5xx do chính server trả (ví dụ 503 của
    # circuit breaker ClickHouse) vẫn đi nguyên tới client, không bị thay bằng trang này.
    # Muốn trang này hiện khi dừng hệ thống thì để gateway chạy:
    #   docker compose -p kltn stop  &&  docker compose -p kltn start gateway
    error_page 502 503 504 =503 /__maintenance.html;
    location = /__maintenance.html {
        internal;
        alias /usr/share/nginx/maintenance/maintenance.html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }
    location = /__maintenance.json {
        internal;
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 503 '{"error":"Hệ thống đang bảo trì, vui lòng thử lại sau ít phút.","code":"MAINTENANCE"}';
    }

    location /api/ {
        set $server server:8080;
        proxy_pass http://$server;
        error_page 502 503 504 =503 /__maintenance.json;
    }

    location /socket.io/ {
        set $server server:8080;
        proxy_pass http://$server;
        # proxy_set_header trong location thay hẳn bộ header ở cấp server,
        # nên phải khai lại Host và X-Forwarded-For.
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        error_page 502 503 504 =503 /__maintenance.json;
    }

    # Trang Swagger của FastAPI nạp spec từ đường dẫn tuyệt đối '/openapi.json'.
    # Qua gateway, đường dẫn đó rơi vào web chứ không vào ai-rec, nên sửa nó
    # ngay trong HTML trả về.
    location = /ai-rec/docs {
        set $ai_rec ai-rec:8000;
        rewrite ^ /docs break;
        proxy_pass http://$ai_rec;
        proxy_set_header   Accept-Encoding "";
        sub_filter         "'/openapi.json'" "'/ai-rec/openapi.json'";
        sub_filter_once    on;
    }

    location = /ai-rec {
        return 301 /ai-rec/;
    }

    location /ai-rec/ {
        set $ai_rec ai-rec:8000;
        rewrite ^/ai-rec/(.*)$ /$1 break;
        proxy_pass http://$ai_rec;
        # ai-rec chuyển "/" sang "/docs"; thêm lại tiền tố cho header Location.
        proxy_redirect / /ai-rec/;
        error_page 502 503 504 =503 /__maintenance.json;
    }

    location = /ai-bot {
        return 301 /ai-bot/;
    }

    location /ai-bot/ {
        set $ai_bot ai-bot:3001;
        rewrite ^/ai-bot/(.*)$ /$1 break;
        proxy_pass http://$ai_bot;
        proxy_redirect / /ai-bot/;
        error_page 502 503 504 =503 /__maintenance.json;
    }

    location / {
        set $client client:80;
        proxy_pass http://$client;
    }
}

# Cổng chuyển thẳng sang server, cho WebSocket của dashboard admin.
#
# Dashboard.jsx mở WebSocket tới `${hostname}:8080` (cổng gốc của server), không
# đi qua /api. server chỉ expose trong network nên từ ngoài không có gì nghe ở
# 8080. Cổng này đưa mọi request — kể cả Upgrade — tới server:8080. Trên máy
# demo, `tailscale serve --https=8080 http://127.0.0.1:18081` trỏ vào đây để
# trình duyệt nhận wss://<tên-máy>.<tailnet>.ts.net:8080.
server {
    listen 8081;
    server_name _;

    error_page 502 503 504 =503 /__maintenance.json;
    location = /__maintenance.json {
        internal;
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 503 '{"error":"Hệ thống đang bảo trì, vui lòng thử lại sau ít phút.","code":"MAINTENANCE"}';
    }

    location / {
        set $server server:8080;
        proxy_pass http://$server;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }
}

# =============================================================================
# Cổng PUBLIC — cửa hàng cho khách trên Internet (thêm 11/11/2026)
#
# Hai server ở trên dành cho tailnet (admin, dev) và mở mọi thứ. Server này thì
# CHẶN MẶC ĐỊNH: chỉ mở đúng những path mà giao diện cửa hàng gọi. Mọi /api khác,
# AI-Rec, AI-Bot, WebSocket dashboard và trang quản trị đều 404 — như không tồn tại.
#
# Đây là MỘT trong hai lớp. Lớp còn lại nằm ở server: requireAdmin cho /api/b2b,
# dashboard, analytics... Hai lớp độc lập: lỡ sai một dòng ở đây thì server vẫn
# chặn, và ngược lại.
#
# Danh sách mở đối chiếu với client/src/services/api.js và các fetch trực tiếp
# (AIChatbot.jsx, useTracking.js) ngày 11/11/2026. Cửa hàng gọi thêm path mới thì
# phải thêm vào đây, nếu không tính năng đó 404 ở bản public.
#
# Chỉ publish ra 127.0.0.1 (docker-compose.yml): Internet tới được nó qua Tailscale
# Funnel / tunnel trỏ vào cổng loopback đó, không qua cổng nào của máy.
# =============================================================================
server {
    listen 8090;
    server_name _;

    # Tìm bằng ảnh gửi ảnh base64 trong body JSON — như server tailnet ở trên
    client_max_body_size 20m;
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # Tailscale ghi IP thật của khách vào X-Forwarded-For; giữ nguyên và nối thêm
    # hop này. Server tính rate limit theo IP đó (trust proxy trong index.js).
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # ── Trang bảo trì (thêm 11/11/2026) ─────────────────────────────────────
    # Dịch vụ phía sau không trả lời (container dừng -> DNS Docker không phân giải
    # được tên, hoặc từ chối kết nối / quá giờ) thì nginx tự sinh 502/504. Trước
    # đây khi dừng hệ thống, Tailscale trả 502 RỖNG không Content-Type và trình
    # duyệt điện thoại tải về thành file .txt. Giờ: trang HTML cho người, JSON cho
    # /api (đặt error_page riêng trong các location API bên dưới).
    # KHÔNG bật proxy_intercept_errors: lỗi 5xx do chính server trả (ví dụ 503 của
    # circuit breaker ClickHouse) vẫn đi nguyên tới client, không bị thay bằng trang này.
    # Muốn trang này hiện khi dừng hệ thống thì để gateway chạy:
    #   docker compose -p kltn stop  &&  docker compose -p kltn start gateway
    error_page 502 503 504 =503 /__maintenance.html;
    location = /__maintenance.html {
        internal;
        alias /usr/share/nginx/maintenance/maintenance.html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }
    location = /__maintenance.json {
        internal;
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 503 '{"error":"Hệ thống đang bảo trì, vui lòng thử lại sau ít phút.","code":"MAINTENANCE"}';
    }

    # ── Trang quản trị và trang trình diễn nội bộ ────────────────────────────
    # SPA trả index.html cho MỌI đường dẫn, nên phải chặn ở đây thì /admin mới 404
    # thay vì hiện trang đăng nhập admin cho cả Internet.
    location ^~ /admin   { return 404; }
    location = /data-lake { return 404; }

    # ── API của cửa hàng ─────────────────────────────────────────────────────
    location /api/b2c/ {
        set $server server:8080;
        proxy_pass http://$server;
        error_page 502 503 504 =503 /__maintenance.json;
    }

    # Thanh tìm kiếm thông minh, tìm bằng ảnh, nói thành chữ. Server có hạn mức
    # riêng theo IP cho các path này vì chúng gọi LLM tính tiền theo lượt.
    location /api/ai/ {
        set $server server:8080;
        proxy_pass http://$server;
        error_page 502 503 504 =503 /__maintenance.json;
    }

    # Webhook SePay: ĐÚNG MỘT path, chỉ POST. Xác thực bằng chữ ký HMAC / API key
    # ở server. KHÔNG mở cả thư mục /api/payment/webhook/: trong đó còn
    # /webhook/simulator (adapter giả lập, bật khi NODE_ENV khác production) —
    # ai có PAYMENT_SIMULATOR_KEY là đánh dấu đơn đã thanh toán mà không có tiền.
    location = /api/payment/webhook/sepay {
        limit_except POST { deny all; }
        set $server server:8080;
        proxy_pass http://$server;
        error_page 502 503 504 =503 /__maintenance.json;
    }

    location = /api/health {
        set $server server:8080;
        proxy_pass http://$server;
        error_page 502 503 504 =503 /__maintenance.json;
    }

    # ── Mọi thứ khác của backend: 404 ───────────────────────────────────────
    location /api/      { return 404; }
    location /ai-rec    { return 404; }
    location /ai-bot    { return 404; }
    location /socket.io { return 404; }

    # ── Giao diện cửa hàng (và /product-images/ — bucket ảnh chỉ-đọc trên MinIO,
    #    do nginx của client chuyển tiếp) ──────────────────────────────────────
    location / {
        set $client client:80;
        proxy_pass http://$client;
    }
}
