# =============================================================================
# Gateway — một cổng vào cho mọi dịch vụ ứng dụng, chia theo đường dẫn
#
#   /            -> client:80           web (SPA)
#   /api/        -> server:8080/api/    API của server, giữ nguyên đường dẫn
#   /socket.io/  -> server:8080         WebSocket (giữ cho khớp nginx của client;
#                                       server hiện chưa chạy socket.io nên 404)
#   /ai-rec/     -> ai-rec:8000/        bỏ tiền tố /ai-rec   (Swagger: /ai-rec/docs)
#   /ai-bot/     -> ai-bot:3001/        bỏ tiền tố /ai-bot
#
# Các UI hạ tầng (Metabase, MinIO, ClickHouse, Kafka Connect) vẫn ở cổng riêng:
# đặt chúng dưới đường dẫn con thì phải cấu hình lại base URL của từng cái.
# =============================================================================

# Tên upstream nằm trong biến nên nginx phân giải lúc có request, qua DNS của
# Docker (127.0.0.11), chứ không phải lúc khởi động. Một dịch vụ đang dừng chỉ
# làm route của nó trả 502, không kéo cả gateway chết vì "host not found in
# upstream". Hệ quả của proxy_pass dùng biến: nginx không tự thay tiền tố đường
# dẫn, nên các route có tiền tố phải bỏ tiền tố bằng rewrite.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Tìm theo ảnh gửi ảnh base64 trong body JSON; mặc định nginx chặn ở 1 MB.
    client_max_body_size 20m;

    # nginx nghe cổng 80 trong container nhưng ra ngoài là cổng 8000. Để redirect
    # tuyệt đối thì nginx ghép host với cổng 80 (tức bỏ cổng) và trình duyệt bị
    # đẩy sang http://<máy>/... sai cổng. Giữ Location tương đối.
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /api/ {
        set $server server:8080;
        proxy_pass http://$server;
    }

    location /socket.io/ {
        set $server server:8080;
        proxy_pass http://$server;
        # proxy_set_header trong location thay hẳn bộ header ở cấp server,
        # nên phải khai lại Host và X-Forwarded-For.
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Trang Swagger của FastAPI nạp spec từ đường dẫn tuyệt đối '/openapi.json'.
    # Qua gateway, đường dẫn đó rơi vào web chứ không vào ai-rec, nên sửa nó
    # ngay trong HTML trả về.
    location = /ai-rec/docs {
        set $ai_rec ai-rec:8000;
        rewrite ^ /docs break;
        proxy_pass http://$ai_rec;
        proxy_set_header   Accept-Encoding "";
        sub_filter         "'/openapi.json'" "'/ai-rec/openapi.json'";
        sub_filter_once    on;
    }

    location = /ai-rec {
        return 301 /ai-rec/;
    }

    location /ai-rec/ {
        set $ai_rec ai-rec:8000;
        rewrite ^/ai-rec/(.*)$ /$1 break;
        proxy_pass http://$ai_rec;
        # ai-rec chuyển "/" sang "/docs"; thêm lại tiền tố cho header Location.
        proxy_redirect / /ai-rec/;
    }

    location = /ai-bot {
        return 301 /ai-bot/;
    }

    location /ai-bot/ {
        set $ai_bot ai-bot:3001;
        rewrite ^/ai-bot/(.*)$ /$1 break;
        proxy_pass http://$ai_bot;
        proxy_redirect / /ai-bot/;
    }

    location / {
        set $client client:80;
        proxy_pass http://$client;
    }
}

# Cổng chuyển thẳng sang server, cho WebSocket của dashboard admin.
#
# Dashboard.jsx mở WebSocket tới `${hostname}:8080` (cổng gốc của server), không
# đi qua /api. server chỉ expose trong network nên từ ngoài không có gì nghe ở
# 8080. Cổng này đưa mọi request — kể cả Upgrade — tới server:8080. Trên máy
# demo, `tailscale serve --https=8080 http://127.0.0.1:18081` trỏ vào đây để
# trình duyệt nhận wss://<tên-máy>.<tailnet>.ts.net:8080.
server {
    listen 8081;
    server_name _;

    location / {
        set $server server:8080;
        proxy_pass http://$server;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }
}
