<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Getshopy đang bảo trì</title>
  <!--
    Trang gateway trả khi dịch vụ phía sau không trả lời (502/503/504) — xem
    error_page trong gateway/nginx.conf. Trước đây lúc hệ thống dừng, Tailscale trả
    502 rỗng không Content-Type và trình duyệt điện thoại tải về thành file .txt.
    Tự chứa hoàn toàn (không font/ảnh/script ngoài): lúc này không có dịch vụ nào
    khác để tải tài nguyên.
  -->
  <style>
    :root {
      --bg: #ffffff; --fg: #0a0a0a; --sub: #6b6b74; --line: #e7e7ea; --soft: #f5f5f7;
      --inv: #0a0a0a; --inv-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a; --fg: #fafafa; --sub: #a1a1aa; --line: #26262b; --soft: #141417;
        --inv: #fafafa; --inv-fg: #0a0a0a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 440px; text-align: center; }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 28px; border-radius: 16px;
      background: var(--inv); color: var(--inv-fg);
      display: flex; align-items: center; justify-content: center;
    }
    .brand { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--sub); margin-bottom: 10px; }
    h1 { font-size: clamp(26px, 7vw, 32px); font-weight: 750; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 12px; }
    p { font-size: 15.5px; line-height: 1.6; color: var(--sub); }
    .card {
      margin-top: 28px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--soft); display: flex; align-items: center; gap: 12px; text-align: left;
    }
    .dot { position: relative; width: 10px; height: 10px; flex-shrink: 0; }
    .dot::before, .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--fg); }
    .dot::after { animation: ping 1.6s cubic-bezier(0, 0, .2, 1) infinite; opacity: .5; }
    @keyframes ping { 75%, 100% { transform: scale(2.6); opacity: 0; } }
    .status { font-size: 14px; line-height: 1.45; }
    .status small { display: block; color: var(--sub); font-size: 12.5px; margin-top: 2px; }
    button {
      margin-top: 20px; width: 100%; height: 48px; border: 0; border-radius: 12px; cursor: pointer;
      background: var(--inv); color: var(--inv-fg); font: inherit; font-size: 15px; font-weight: 650;
      transition: transform .15s ease, opacity .15s ease;
    }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: default; }
    @media (prefers-reduced-motion: reduce) { .dot::after { animation: none; } button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9L5 8z" />
        <path d="M9 10V7a3 3 0 0 1 6 0v3" />
      </svg>
    </div>
    <div class="brand">Getshopy</div>
    <h1>Hệ thống đang bảo trì</h1>
    <p>Chúng tôi đang khởi động lại hoặc nâng cấp hệ thống. Giỏ hàng và đơn hàng của bạn vẫn được giữ nguyên. Vui lòng quay lại sau ít phút.</p>

    <div class="card" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <div class="status">
        <span id="msg">Trang sẽ tự mở lại khi hệ thống sẵn sàng</span>
        <small id="sub">Đang kiểm tra…</small>
      </div>
    </div>

    <button id="retry" type="button">Thử lại ngay</button>
  </main>

  <script>
    // Hỏi /api/health (mở ở cả cổng public lẫn cổng tailnet). Còn bảo trì thì gateway
    // trả 503 JSON; server lên lại thì 200 -> tải lại đúng trang khách đang mở.
    (function () {
      var sub = document.getElementById('sub');
      var btn = document.getElementById('retry');
      var INTERVAL = 15;
      var left = INTERVAL, busy = false;

      function check() {
        if (busy) return;
        busy = true; btn.disabled = true; sub.textContent = 'Đang kiểm tra…';
        fetch('/api/health', { cache: 'no-store' })
          .then(function (r) {
            if (r.ok) { sub.textContent = 'Hệ thống đã sẵn sàng, đang mở lại…'; location.reload(); return; }
            throw new Error(String(r.status));
          })
          .catch(function () { left = INTERVAL; tick(); })
          .then(function () { busy = false; btn.disabled = false; });
      }
      function tick() { sub.textContent = 'Kiểm tra lại sau ' + left + ' giây'; }

      setInterval(function () {
        if (busy) return;
        left -= 1;
        if (left <= 0) check(); else tick();
      }, 1000);
      btn.addEventListener('click', check);
      tick();
    })();
  </script>
</body>
</html>
