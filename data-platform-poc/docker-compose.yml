version: '3.8'

services:
  postgres-mock-source:

    image: postgres:15-alpine
    container_name: postgres_mock_source
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_SOURCE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SOURCE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SOURCE_DB}
      POSTGRES_PORT: ${POSTGRES_SOURCE_PORT}
    ports:
      - "${POSTGRES_SOURCE_PORT}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Tự động chạy file tạo bảng khi start lần đầu
      - pg_mock_data:/var/lib/postgresql/data
    # Kích hoạt chế độ ghi nhật ký nâng cao phục vụ CDC (Bắt buộc)
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4"]
  clickhouse-local:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: clickhouse_local
    env_file:
      - .env
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    ports:
      - "${CLICKHOUSE_PORT}:8123" # Cổng HTTP để dbt và DBeaver chọc vào
      - "9000:9000"              # Cổng TCP Client
    volumes:
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144



volumes:
  pg_mock_data:
  ch_data: