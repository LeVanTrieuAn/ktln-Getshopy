name: getshopy

services:
  # ─── Frontend Client (Nginx) ────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Nginx proxy nội bộ → không cần expose server ra ngoài
        VITE_API_URL: /api
        VITE_WS_URL: ""
    ports:
      - "3000:80"   # Docker: localhost:3000 | Vite dev: localhost:5173 (không conflict)
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # ─── AI Services (Recommendation Engine — FastAPI/Python) ───────────────────
  ai-rec:
    build:
      context: ./ai-rec
    expose:
      - "8000"
    volumes:
      - ai_data:/app/data
      - ai_models:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── AI Bot Container (Chatbot + Searchbot — Node.js) ─────────────────────
  ai-bot:
    build:
      context: ./ai-bot
    env_file:
      - ./server/.env
    environment:
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      DATABASE_URL: "postgresql://getshopy:getshopy_dev_password@postgres:5432/getshopy"
      DIRECT_URL: "postgresql://getshopy:getshopy_dev_password@postgres:5432/getshopy"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ─── Backend Server ─────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
    # Đọc toàn bộ biến từ server/.env (nguồn duy nhất cho secrets)
    env_file:
      - ./server/.env
    # Ghi đè các biến Docker-internal (host nội bộ, khác với local dev)
    environment:
      PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      DATABASE_URL: "postgresql://getshopy:getshopy_dev_password@postgres:5432/getshopy"
      DIRECT_URL: "postgresql://getshopy:getshopy_dev_password@postgres:5432/getshopy"
      AI_REC_URL: "http://ai-rec:8000"
      AI_BOT_URL: "http://ai-bot:3001"
    # DNS tường minh — cho phép container gọi Hugging Face API bên ngoài
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Server chỉ expose nội bộ; client Nginx proxy tới đây
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-rec:
        condition: service_healthy
      ai-bot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-getshopy}
      POSTGRES_USER: ${POSTGRES_USER:-getshopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-getshopy_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped


  # ─── Redis Cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ai_data:
  ai_models:
