version: '3.8'

services:
  backend:
    build: 
      context: ./source/server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./source/server:/app
      - /app/node_modules
    environment:
      - PORT=8080
    restart: unless-stopped

  frontend:
    build:
      context: ./source/client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
