# =============================================================================
# Luật cảnh báo (Grafana unified alerting, nạp từ file) — 19/11/2026
#
# Tài liệu, ngưỡng, cách đọc email, cách xử lý: docs/monitoring.md, mục "Cảnh báo".
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# Lưu ý: Grafana 13.2.5 KHÔNG thay biến môi trường trong file LUẬT (đã thử 19/11/2026: chuỗi
# "${BIEN}" và "$$" giữ nguyên) — khác file contact point. Template viết "$labels" như bình thường;
# số cố định (số bản server) ghi thẳng vào luật. Lỗi đọc file provisioning làm Grafana KHÔNG khởi
# động được (đã gặp khi thử) — sửa file này thì kiểm trên stack thử trước (docs/monitoring.md).
#
# Dữ liệu (Prometheus, monitoring/prometheus/prometheus.yml):
#   probe_success{job="blackbox-server"}   /api/health của TỪNG bản (blackbox exporter)
#   up{job="getshopy-server"}              lượt kéo số đo :9464 của từng bản
#   probe_success{job="blackbox-gateway"}  /api/health QUA gateway
#   probe_success{job="blackbox-public"}   URL public + đường webhook SePay qua Funnel
# "for: 1m": điều kiện phải đúng liên tục 1 phút mới bắn — một bản chết rồi Docker tự khởi động
# lại sau vài giây (restart: unless-stopped) KHÔNG bắn; một bản TREO (tiến trình còn, không trả
# lời — Docker không tự xử lý) thì bắn.
# =============================================================================
apiVersion: 1

groups:
  - orgId: 1
    name: getshopy
    folder: Getshopy
    interval: 10s   # bội số của chu kỳ bộ lập lịch Grafana (10 s)
    rules:
      # ── 1. Một bản server không trả lời ─────────────────────────────────────
      # Giá trị mỗi bản = min(probe /api/health, lượt kéo số đo) -> 0 nếu một trong hai hỏng.
      # Nối nhãn hostname (= id container = X-Served-By) từ getshopy_server_info: bản treo thì chuỗi
      # đó ngừng cập nhật nên lấy chuỗi có mẫu MỚI NHẤT trong 24 giờ cho mỗi instance (IP có thể
      # được cấp lại cho bản mới sau khi scale — chọn mới nhất tránh trùng). Bản chưa từng trả số đo
      # (khởi động hỏng) không có hostname -> không nằm ở đây mà ở luật "Thiếu server".
      # Chỉ xét khi CÒN ít nhất một bản trả lời: lúc không còn bản nào, DNS nội bộ của Docker không
      # trả lời tên "server" và Prometheus GIỮ danh sách bản cũ (đã gỡ) -> mọi bản cũ "không trả
      # lời" -> báo treo sai cho container không còn tồn tại (gặp khi thử 19/11/2026). Trường hợp đó
      # đã có "Web sập" + "Thiếu server".
      - uid: getshopy-server-treo
        title: Server treo
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: getshopy-prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: |
                (
                  min by (instance) (
                      probe_success{job="blackbox-server"}
                    or
                      up{job="getshopy-server"}
                  )
                  * on (instance) group_left (hostname)
                  (
                    0 * topk by (instance) (1, max_over_time(timestamp(getshopy_server_info{job="getshopy-server"})[24h:1m])) + 1
                  )
                )
                and on () (count(probe_success{job="blackbox-server"} == 1) > 0)
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Bản server {{ $labels.hostname }} không trả lời (treo hoặc chết hẳn) hơn 1 phút.'
          description: 'Bản {{ $labels.hostname }} ({{ $labels.instance }}) không trả lời /api/health hoặc không cho kéo số đo. Gateway vẫn có thể gửi request tới nó — request đó chờ tới khi hết thời gian.'
          runbook: 'Treo thì Docker KHÔNG tự khởi động lại — chạy tay: docker restart {{ $labels.hostname }} (rồi chờ email ĐÃ HẾT). Nếu bản đó không còn trong "docker compose ps server" thì xem cảnh báo "Thiếu server".'

      # ── 2. Ít bản healthy hơn số cấu hình ───────────────────────────────────
      # A = số bản THIẾU = 3 - số bản trả lời /api/health. 3 = SERVER_REPLICAS mặc định của
      # docker-compose.yml. ĐỔI SERVER_REPLICAS TRONG .env THÌ SỬA SỐ 3 Ở expr VÀ summary BÊN DƯỚI rồi
      # chạy: docker compose restart grafana (Grafana không thay biến môi trường trong file luật).
      - uid: getshopy-thieu-server
        title: Thiếu server
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: getshopy-prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: '3 - (count(probe_success{job="blackbox-server"} == 1) or vector(0))'
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Thiếu {{ $values.A.Value }} bản server so với cấu hình 3 bản (số bản trả lời /api/health ít hơn SERVER_REPLICAS).'
          description: 'Có bản đã thoát mà không tự lên lại, đang khởi động quá lâu, hoặc số bản đang bị scale xuống (demo, thao tác tay).'
          runbook: 'Xem: docker compose ps server; log: docker compose logs --tail 100 server; dựng lại đủ số bản: docker compose up -d --no-deps server.'

      # ── 3. Web sập: /api/health qua gateway không trả 2xx ───────────────────
      - uid: getshopy-web-sap
        title: Web sập
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: getshopy-prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: probe_success{job="blackbox-gateway"}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        for: 1m
        # Mất luôn dữ liệu probe (blackbox / Prometheus hỏng) cũng coi là sập: không được im lặng.
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Web sập: http://gateway/api/health không trả 2xx hơn 1 phút (hoặc mất dữ liệu probe).'
          description: 'Không bản server nào trả lời qua gateway (gateway trả trang bảo trì 503), hoặc chính gateway chết, hoặc blackbox exporter / Prometheus không chạy.'
          runbook: 'docker compose ps gateway server prometheus blackbox; thử: Invoke-WebRequest http://localhost:18000/api/health -UseBasicParsing; gateway chết: docker compose up -d gateway; mọi bản server chết: docker compose up -d --no-deps server.'

      # ── 4. Tỷ lệ 5xx cao (cảnh báo nhẹ) ────────────────────────────────────
      # Chỉ xét khi có tải (> 0,2 request/s trong 5 phút) để vài lỗi lẻ lúc vắng khách không bắn.
      - uid: getshopy-5xx-cao
        title: Nhiều lỗi 5xx
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: getshopy-prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: |
                (
                  (sum(rate(http_requests_total{job="getshopy-server", status_code=~"5.."}[5m])) or vector(0))
                  / sum(rate(http_requests_total{job="getshopy-server"}[5m]))
                )
                and on () (sum(rate(http_requests_total{job="getshopy-server"}[5m])) > 0.2)
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.05]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Hơn 5 % response của server là 5xx trong 5 phút.'
          description: 'Lỗi chỉ ở một bản: nghi bản đó. Ở mọi bản: phụ thuộc dùng chung (Postgres, ClickHouse, ai-bot) có vấn đề.'
          runbook: 'Dashboard: panel "Lỗi 5xx mỗi bản"; log trong Grafana Explore (Loki): {service="server", status_class="5xx"} | json'

      # ── 6. Request bị kẹt ở gateway (log Loki) ──────────────────────────────
      # 19/11/2026, người dùng: server treo phải biết qua cả lưu lượng (timeout nhiều), không chỉ probe
      # /api/health. Đếm request gateway phải chờ >= 5 s rồi kết thúc 499 (khách bỏ), 502 / 503 (bản đang
      # xử lý chết / bị restart) hoặc 504 (hết proxy_read_timeout). "Nhiều lỗi 5xx" chỉ thấy lỗi DO SERVER
      # trả (số đo của server) — lỗi do gateway sinh ra chỉ luật này thấy. Bỏ /socket.io (long-polling có
      # thể 499 khi khách đóng trang). Thử trên log Loki 19/11/2026: khung server treo 08:33–08:38 -> 8
      # (5 x 499 sau 60 s, 3 x 503 lúc restart); deploy 10:26, scale / failover 10:43, lúc vắng -> 0.
      - uid: getshopy-request-ket
        title: Request bị kẹt ở gateway
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: getshopy-loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({service="gateway"} | json | __error__="" | path!~"/socket.io.*" | status=~"499|502|503|504" | request_time >= 5 [5m]))'
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [2]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ humanize $values.A.Value }} request bị kẹt ở gateway trong 5 phút (chờ >= 5 s rồi 499 / 502 / 503 / 504).'
          description: 'Thường do một bản server treo hoặc chậm, hoặc phụ thuộc dùng chung (Postgres, ClickHouse, ai-bot) chậm. Bản nào: cột upstream_addr / served_by trong log gateway.'
          runbook: 'Grafana Explore (Loki): {service="gateway"} | json | status=~"499|502|503|504" | request_time >= 5 — một upstream_addr lặp lại = bản đó treo: docker restart <id> (xem cảnh báo "Server treo"); rải đều mọi bản = kiểm Postgres / ClickHouse.'

      # ── 5. Đường public / webhook SePay qua Funnel đứt ──────────────────────
      # Probe đi từ container ra Internet rồi vòng về chính máy qua Tailscale Funnel — từ 19/11/2026
      # ~10:00, khi blackbox dùng DNS công khai (docker-compose.yml). Trước đó DNS của máy (MagicDNS)
      # trả IP tailnet nên probe đi tắt qua tailnet: Funnel hỏng mà tailnet còn thì luật KHÔNG báo.
      # probe_success{job="blackbox-public"} = 1 cho cả hai URL (web /api/health và đường webhook
      # SePay :8443) -> BẬT (isPaused: false). Funnel/Tailscale tắt thì luật này báo — đúng lúc
      # webhook thanh toán không về (AGENTS.MD).
      - uid: getshopy-public-dut
        title: Đường public hoặc webhook đứt
        condition: C
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: getshopy-prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: probe_success{job="blackbox-public"}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Không vào được {{ $labels.instance }} từ Internet hơn 2 phút.'
          description: 'Đường webhook SePay đứt thì tiền vào mà đơn vẫn PENDING rồi hết hạn (AGENTS.MD).'
          runbook: 'tailscale funnel status; thử ĐÚNG đường public (trên máy production tên này ra IP tailnet): lấy IP bằng https://dns.google/resolve?name=msi.taild22ef7.ts.net&type=A rồi curl.exe -sS -o NUL -D - --resolve msi.taild22ef7.ts.net:8443:<IP> https://msi.taild22ef7.ts.net:8443/api/payment/webhook/sepay -> 404 có X-Served-By là thông (AGENTS.MD).'
