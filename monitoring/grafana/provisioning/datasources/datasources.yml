# Nguồn dữ liệu cho Grafana — Prometheus (số đo) và Loki (log) — nạp tự động lúc khởi động (provisioning).
# https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
# uid cố định: dashboard trong monitoring/grafana/dashboards/ trỏ thẳng tới uid này.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: getshopy-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # = scrape_interval của job getshopy-server (monitoring/prometheus/prometheus.yml).
      # Grafana tính $__rate_interval = max($__interval + timeInterval, 4 x timeInterval), nên
      # khai đúng thì rate() luôn có đủ mẫu.
      # https://grafana.com/docs/grafana/latest/datasources/prometheus/template-variables/#use-__rate_interval
      timeInterval: 5s
      httpMethod: POST
      # Cảnh báo là của Grafana (provisioning/alerting) — không dùng ruler của nguồn dữ liệu.
      manageAlerts: false

  # Log tập trung (19/11/2026, docs/monitoring.md "Log tập trung"). Loki chỉ nghe trong network Docker.
  - name: Loki
    uid: getshopy-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      # Loki không chạy ruler: tắt để Grafana không hỏi /api/ruler (lỗi 400 trong trình duyệt).
      manageAlerts: false
