# Nguồn dữ liệu Prometheus cho Grafana — nạp tự động lúc khởi động (provisioning), 19/11/2026.
# https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
# uid cố định: dashboard trong monitoring/grafana/dashboards/ trỏ thẳng tới uid này.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: getshopy-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # = scrape_interval của job getshopy-server (monitoring/prometheus/prometheus.yml).
      # Grafana tính $__rate_interval = max($__interval + timeInterval, 4 x timeInterval), nên
      # khai đúng thì rate() luôn có đủ mẫu.
      # https://grafana.com/docs/grafana/latest/datasources/prometheus/template-variables/#use-__rate_interval
      timeInterval: 5s
      httpMethod: POST
