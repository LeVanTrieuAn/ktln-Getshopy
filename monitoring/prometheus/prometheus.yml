# =============================================================================
# Prometheus — số đo của các bản `server` (cân bằng tải), 19/11/2026
#
# Tài liệu: docs/monitoring.md. Dashboard: monitoring/grafana/dashboards/.
#
# Đọc lại file này sau khi sửa (không cần tạo lại container):
#   docker compose kill -s SIGHUP prometheus
# (Không bật --web.enable-lifecycle: endpoint /-/reload, /-/quit sẽ mở cho MỌI container
#  trong network.)
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Các bản server ──────────────────────────────────────────────────────────
  # Số bản thay đổi (SERVER_REPLICAS, --scale, lb-demo.ps1, grafana-demo.ps1) nên KHÔNG liệt kê
  # địa chỉ cứng. DNS nội bộ của Docker trả MỌI IP của service cho tên `server` (cùng cơ chế
  # gateway dùng để chia tải) -> dns_sd_configs kiểu A: mỗi IP là một target ip:9464.
  # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#dns_sd_config
  #
  # 5 s thay vì 15 s mặc định: demo trực tiếp cần thấy bản mới / bản chết trong vài giây, và
  # rate() cần >= 4 mẫu trong cửa sổ ($__rate_interval của Grafana = 4 x 5 s = 20 s). Đổi lại:
  # số mẫu lưu gấp 3 — xem mục chi phí trong docs/monitoring.md.
  - job_name: getshopy-server
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    dns_sd_configs:
      - names: [server]
        type: A
        port: 9464
        # Mặc định 30 s: scale lên thì nửa phút sau mới thấy bản mới. Hỏi DNS nội bộ của
        # Docker mỗi 5 s là không đáng kể.
        refresh_interval: 5s

  # ── Thăm dò HTTP (blackbox exporter, monitoring/blackbox/blackbox.yml) — đầu vào cảnh báo ──
  # Prometheus gọi blackbox:9115/probe?target=<url>; nhãn instance đặt lại cho dễ đọc / để nối.
  # https://github.com/prometheus/blackbox_exporter#prometheus-configuration
  #
  # Từng bản server: http://<ip>:8080/api/health — cùng danh sách bản như job getshopy-server (DNS).
  # instance đổi về <ip>:9464 = instance của job getshopy-server, để cảnh báo "Server treo" nối
  # được nhãn hostname (getshopy_server_info) — tên dùng được ngay cho `docker restart <hostname>`.
  - job_name: blackbox-server
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 10s
    scrape_timeout: 5s
    dns_sd_configs:
      - names: [server]
        type: A
        port: 8080
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
        replacement: 'http://${1}/api/health'
      - source_labels: [__address__]
        regex: '(.+):8080'
        target_label: instance
        replacement: '${1}:9464'
      - target_label: __address__
        replacement: blackbox:9115

  # Qua gateway — đúng đường khách đi (không bản nào trả lời thì gateway trả 503 trang bảo trì).
  - job_name: blackbox-gateway
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['http://gateway/api/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Đường PUBLIC qua Tailscale Funnel (từ container ra Internet rồi vòng về chính máy này):
  # web 443 -> gateway 8090, và đường webhook SePay 8443 -> gateway 80 (AGENTS.MD). Chỉ đi qua
  # Funnel thật khi blackbox dùng DNS công khai (docker-compose.yml, service blackbox, `dns:`) —
  # DNS của máy (MagicDNS) trả IP tailnet. Luật cảnh báo: "Đường public hoặc webhook đứt".
  # 30 s/lượt: mỗi lượt là một request thật qua Funnel. scrape_timeout 25 s > timeout 20 s của
  # module (đường Funnel thật mất 2,8–7,3 s mỗi request — blackbox.yml).
  - job_name: blackbox-public
    metrics_path: /probe
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ['https://msi.taild22ef7.ts.net/api/health']
        labels: {module: http_2xx_public}
      - targets: ['https://msi.taild22ef7.ts.net:8443/api/payment/webhook/sepay']
        labels: {module: http_webhook_get_404}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ── Chính Prometheus (RAM, số chuỗi, dung lượng TSDB — để đo chi phí giám sát) ──
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
