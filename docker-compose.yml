# =============================================================================
# KLTN — toàn bộ hệ thống trong một compose
#
#   Ecommerce : client, server, ai-bot, ai-rec, postgres, redis
#   BigData   : kafka, zookeeper, kafka-connect, minio, clickhouse, metabase
#
# Ba hệ dùng CHUNG một network và một file .env ở thư mục này.
#
# Hai quyết định đáng chú ý (13/09):
#   - MỘT Postgres. Bỏ postgres-mock-source của sandbox; CDC đọc thẳng DB thật
#     của Ecommerce.
#   - MỘT ClickHouse. Bỏ clickhouse-local; dùng bản 24.8 cho cả analytics của
#     Ecom lẫn warehouse của dbt (sandbox trước dùng 23.8).
#
#   docker compose up -d                    # toàn bộ
#   docker compose up -d client server      # chỉ hệ Ecommerce
#   docker compose --profile bigdata up -d  # thêm hệ BigData
# =============================================================================

name: kltn

x-ecom-build: &ecom-build
  context: ./ktln-Getshopy/qu-n-ly-ban-l/source

services:

  # ═══ ECOMMERCE ═══════════════════════════════════════════════════════════

  client:
    build:
      context: ./ktln-Getshopy/qu-n-ly-ban-l/source/client
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ""
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: ./ktln-Getshopy/qu-n-ly-ban-l/source/server
    env_file: [.env]
    environment:
      # Trong network của compose thì gọi nhau bằng tên service, không phải localhost
      DATABASE_URL: "postgresql://${POSTGRES_USER:-getshopy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-getshopy}"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-getshopy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-getshopy}"
      CLICKHOUSE_HOST: http://clickhouse:8123
      REDIS_URL: redis://redis:6379
      AI_BOT_URL: http://ai-bot:3001
      AI_REC_URL: http://ai-rec:8000
    expose: ["8080"]
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ai-bot:
    build:
      context: ./ktln-Getshopy/qu-n-ly-ban-l/source/ai-bot
    env_file: [.env]
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-getshopy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-getshopy}"
    expose: ["3001"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  ai-rec:
    build:
      context: ./ktln-Getshopy/qu-n-ly-ban-l/source/ai-rec
    environment:
      PORT: 8000
      DEFAULT_TOP_K: 10
      # Lấy dữ liệu train thẳng từ ClickHouse — xem data-contract-warehouse.md §4
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${AI_REC_CH_USER:-ai_rec}
      CLICKHOUSE_PASSWORD: ${AI_REC_CH_PASSWORD:-}
    expose: ["8000"]
    volumes:
      - ai_data:/app/data
      - ai_models:/app/output
    restart: unless-stopped

  # ═══ DỮ LIỆU ═════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    # wal_level=logical là điều kiện bắt buộc để Debezium tạo replication slot.
    # Thiếu thì connector báo lỗi lúc ĐĂNG KÝ, không phải lúc chạy.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-getshopy}
      POSTGRES_USER: ${POSTGRES_USER:-getshopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      # 9000 là cổng mặc định của cả ClickHouse TCP lẫn MinIO — đổi để khỏi đụng
      - "${CLICKHOUSE_TCP_PORT:-9010}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./ktln-Getshopy/qu-n-ly-ban-l/source/clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./local-infra-sandbox/config-clickhouse/s3.xml:/etc/clickhouse-server/config.d/s3.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose: ["6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ═══ BIGDATA — profile 'bigdata' ═════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    profiles: [bigdata]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    profiles: [bigdata]
    depends_on: [zookeeper]
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT cho nội bộ compose, PLAINTEXT_HOST cho máy host
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  kafka-connect:
    # Build thay vì mount JAR: plugin ~50MB, ghim phiên bản trong Dockerfile
    build:
      context: ./local-infra-sandbox/kafka-connect
    profiles: [bigdata]
    depends_on: [kafka]
    ports: ["${KAFKA_CONNECT_PORT:-8083}:8083"]
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Connector config đọc bí mật qua ${env:...} thay vì hardcode trong JSON
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ./local-infra-sandbox/config-json:/config-json:ro
    restart: unless-stopped

  minio:
    # quay.io chứ không phải Docker Hub: MinIO đã gỡ image khỏi Docker Hub
    # công khai, `docker pull minio/minio` trả "pull access denied".
    # quay.io là registry chính thức MinIO vẫn phát hành.
    image: quay.io/minio/minio:${MINIO_VERSION:-latest}
    profiles: [bigdata]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    profiles: [bigdata]
    # 3000 đã dành cho client Getshopy
    ports: ["${METABASE_PORT:-3001}:3000"]
    depends_on:
      clickhouse: {condition: service_healthy}
    restart: unless-stopped

  # Chạy một lần sau khi các service sẵn sàng, rồi thoát.
  # Bốn việc phải đúng thứ tự và phải chờ service khác lên: tạo bucket MinIO,
  # user ClickHouse cho AI-Rec, kéo masterdata, đăng ký connector CDC. Làm tay
  # thì dễ sót bước hoặc chạy sai thứ tự, mà lỗi kiểu đó không hiện ra ngay —
  # chỉ là dữ liệu không bao giờ chảy.
  bootstrap:
    build:
      context: ./scripts/bootstrap
    profiles: [bigdata]
    command: ["/bootstrap.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-getshopy}
      POSTGRES_USER: ${POSTGRES_USER:-getshopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-data-lake}
      AI_REC_CH_USER: ${AI_REC_CH_USER:-ai_rec}
      AI_REC_CH_PASSWORD: ${AI_REC_CH_PASSWORD:-}
      CLIENT_PORT: ${CLIENT_PORT:-3000}
    volumes:
      - ./scripts/bootstrap-bigdata.sh:/bootstrap.sh:ro
      - ./local-infra-sandbox/config-json:/config-json:ro
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
      kafka-connect: {condition: service_started}
    # Chạy xong thì thoát, không dựng lại
    restart: "no"

  # dbt — CHẠY THỦ CÔNG, không có scheduler.
  #
  #   docker compose --profile dbt run --rm dbt build   # dựng toàn bộ model
  #   docker compose --profile dbt run --rm dbt test    # chạy test
  #   docker compose --profile dbt run --rm dbt run --select mart_revenue
  #
  # profile 'dbt' nên `up -d` thường không đụng tới nó.
  dbt:
    build:
      context: ./scripts/dbt
    profiles: [dbt]
    working_dir: /dbt
    volumes:
      - ./local-infra-sandbox/dbt_warehouse:/dbt
    environment:
      CH_HOST: clickhouse
      CH_PORT: 8123
      CH_USER: ${CLICKHOUSE_USER:-default}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CH_DB: default
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: ${MINIO_BUCKET:-data-lake}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-cdc_prod}
      PG_SOURCE_HOST: postgres
      PG_SOURCE_PORT: 5432
      PG_SOURCE_DB: ${POSTGRES_DB:-getshopy}
      PG_SOURCE_USER: ${POSTGRES_USER:-getshopy}
      PG_SOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  # Scheduler gọi dbt theo lịch. Tách khỏi service `dbt` (chạy tay) để hai
  # cách dùng không giẫm chân nhau.
  #
  # ofelia đọc lịch từ label của chính nó, gọi `docker run` lên image dbt.
  # Nhẹ hơn Airflow rất nhiều — quy mô này chưa cần DAG, retry policy hay
  # backfill.
  #
  # `dbt build` chứ không `dbt run`: build = run + test, nên checksum 3 tầng
  # chạy mỗi lượt và phát hiện lệch sớm. Chạy `run` là mất dữ liệu giữa đường
  # mà không ai biết cho tới khi chạy test tay.
  dbt-scheduler:
    image: mcuadros/ofelia:latest
    profiles: [bigdata]
    depends_on:
      clickhouse: {condition: service_healthy}
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-run.dbt-build.schedule: "@every ${DBT_SCHEDULE:-5m}"
      ofelia.job-run.dbt-build.image: "kltn-dbt:latest"
      ofelia.job-run.dbt-build.network: "kltn_default"
      ofelia.job-run.dbt-build.volume: "${PWD}/local-infra-sandbox/dbt_warehouse:/dbt"
      ofelia.job-run.dbt-build.command: "build"
      ofelia.job-run.dbt-build.environment: >-
        CH_HOST=clickhouse,CH_PORT=8123,CH_USER=${CLICKHOUSE_USER:-default},CH_PASSWORD=${CLICKHOUSE_PASSWORD:-},CH_DB=default,MINIO_HOST=minio,MINIO_PORT=9000,MINIO_BUCKET=${MINIO_BUCKET:-data-lake},MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY},MINIO_SECRET_KEY=${MINIO_SECRET_KEY},CDC_TOPIC_PREFIX=${CDC_TOPIC_PREFIX:-cdc_prod},PG_SOURCE_HOST=postgres,PG_SOURCE_PORT=5432,PG_SOURCE_DB=${POSTGRES_DB:-getshopy},PG_SOURCE_USER=${POSTGRES_USER:-getshopy},PG_SOURCE_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  minio_data:
  ai_data:
  ai_models:
