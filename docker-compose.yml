# =============================================================================
# KLTN — toàn bộ hệ thống trong một compose
#
#   Ecommerce : client, server, ai-bot, ai-rec, postgres, redis
#   BigData   : kafka, zookeeper, kafka-connect, minio, clickhouse
#
# Ba hệ dùng CHUNG một network và một file .env ở thư mục này.
#
# Hai quyết định đáng chú ý (13/09):
#   - MỘT Postgres. Bỏ postgres-mock-source của sandbox; CDC đọc thẳng DB thật
#     của Ecommerce.
#   - MỘT ClickHouse. Bỏ clickhouse-local; dùng bản 24.8 cho cả analytics của
#     Ecom lẫn warehouse của dbt (sandbox trước dùng 23.8).
#
#   docker compose up -d                    # toàn bộ
#   docker compose up -d client server      # chỉ hệ Ecommerce
#   docker compose --profile bigdata up -d  # thêm hệ BigData
# =============================================================================

name: kltn

# KHÔNG dùng profiles cho các service hạ tầng.
#
# Trước đây zookeeper/kafka/kafka-connect/minio/bootstrap/dbt-scheduler
# nằm sau `profiles: [bigdata]`, nên `docker compose up` chỉ dựng nửa hệ thống:
# web chạy được nhưng CDC không chảy, dbt không có lịch, warehouse rỗng. Người
# mới vào không có cách nào biết mình đang thiếu gì — không có lỗi nào báo ra.
#
# Chỉ `dbt` còn giữ profile, vì nó là lệnh chạy một lần rồi thoát chứ không
# phải service:  docker compose --profile dbt run --rm dbt build

# Cú pháp ${VAR:?thông báo} làm compose DỪNG HẲN khi biến rỗng hoặc chưa đặt.
# Mặc định compose chỉ cảnh báo rồi thay chuỗi rỗng — Postgres khởi động với
# mật khẩu trống, MinIO hỏng, và người mới nhận một chuỗi lỗi không liên quan
# gì tới nguyên nhân thật là quên file .env.

x-ecom-build: &ecom-build
  context: ./ktln-Getshopy/qu-n-ly-ban-l/source

services:

  # ═══ ECOMMERCE ═══════════════════════════════════════════════════════════

  client:
    image: ghcr.io/heartmindzc/ktln-getshopy-client:${IMAGE_TAG:-local}  # IMAGE_TAG: deploy/cd/README.md
    build:
      context: ./ktln-Getshopy/qu-n-ly-ban-l/source/client
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # ── server: N bản sau nginx gateway (cân bằng tải, 18/11/2026) ────────────
  # Số bản: SERVER_REPLICAS trong .env (mặc định 3). Đổi nóng không cần sửa file:
  #   docker compose up -d --no-deps --scale server=2 server
  # KHÔNG đặt container_name / ports cho service này: cả hai buộc đúng MỘT container.
  # Lệnh chạy tay trong server: `docker compose exec server ...` (mặc định bản số 1,
  # chọn bản khác bằng --index 2). Gateway chia request bằng `upstream` + `resolve`
  # (gateway/nginx.conf). Trạng thái dùng chung giữa các bản và lý do từng quyết định:
  # docs/load-balancing.md.
  server:
    image: ghcr.io/heartmindzc/ktln-getshopy-server:${IMAGE_TAG:-local}
    build:
      context: ./ktln-Getshopy/qu-n-ly-ban-l/source/server
    deploy:
      replicas: ${SERVER_REPLICAS:-3}
    env_file: [.env]
    environment:
      # Trong network của compose thì gọi nhau bằng tên service, không phải localhost
      #
      # connection_limit: pool Prisma của MỖI bản. Không đặt thì Prisma lấy 2 x số CPU + 1
      # (https://www.prisma.io/docs/orm/prisma-client/setup-and-configuration/databases-connections/connection-pool)
      # — trên máy ảo nhiều nhân, 3 bản đã vượt max_connections = 100 mặc định của Postgres.
      # Tổng = SERVER_REPLICAS x SERVER_DB_CONNECTION_LIMIT, cộng ai-bot, Debezium, pg_dump,
      # lúc khởi động thêm 1 kết nối khoá/bản. Bảng tính: docs/load-balancing.md.
      # Tối thiểu 2: job đóng đơn quá hạn giữ 1 kết nối làm khoá trong lúc chạy.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-getshopy}:${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}@postgres:5432/${POSTGRES_DB:-getshopy}?connection_limit=${SERVER_DB_CONNECTION_LIMIT:-10}"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-getshopy}:${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}@postgres:5432/${POSTGRES_DB:-getshopy}"
      CLICKHOUSE_HOST: http://clickhouse:8123
      REDIS_URL: redis://redis:6379
      AI_BOT_URL: http://ai-bot:3001
      AI_REC_URL: http://ai-rec:8000
      # Header X-Served-By = id container, để thấy bản nào trả lời (scripts/lb-demo.ps1).
      # Cổng public 8090 của gateway gỡ header này. Tắt: SERVED_BY_HEADER=0 trong .env.
      SERVED_BY_HEADER: ${SERVED_BY_HEADER:-1}
      # Tắt êm khi SIGTERM (src/lifecycle/gracefulShutdown.js): mốc cứng phải nhỏ hơn
      # stop_grace_period bên dưới, nếu không Docker SIGKILL trước khi dọn xong.
      SHUTDOWN_TIMEOUT_MS: ${SERVER_SHUTDOWN_TIMEOUT_MS:-8000}
      # Chuẩn bị DB lúc khởi động (docker-entrypoint.sh): auto = migrate + seed nền khi DB
      # trống (máy mới dựng lần đầu); off = không đụng DB, chỉ chạy server. Deploy qua CD
      # luôn đặt off. Máy production nên đặt SERVER_DB_PREP=off trong .env để cả lần
      # `docker compose up -d` gõ tay cũng chỉ thay code.
      DB_PREP: ${SERVER_DB_PREP:-auto}
      # Số đo Prometheus (src/metrics, docs/monitoring.md) trên cổng RIÊNG 9464 — không phải route
      # của Express nên gateway / Funnel không tới được; cổng chỉ `expose` trong network.
      # Prometheus tìm mọi bản qua DNS (monitoring/prometheus/prometheus.yml, cổng 9464 ghi cứng ở
      # đó — đổi một chỗ thì đổi cả hai). Tắt: METRICS_ENABLED=0 trong .env.
      METRICS_ENABLED: ${METRICS_ENABLED:-1}
      METRICS_PORT: "9464"
      # Log mỗi request thành MỘT dòng JSON cho Loki (src/middleware/requestLog.js — không ghi query,
      # header, body, cookie, token). SERVER_LOG_FORMAT=dev trong .env = morgan('dev') như trước.
      LOG_FORMAT: ${SERVER_LOG_FORMAT:-json}
    expose: ["8080", "9464"]
    # docker stop / --scale xuống: SIGTERM, chờ chừng này rồi mới SIGKILL (mặc định 10 s).
    stop_grace_period: 12s
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      # 180 s (trước 18/11/2026: 30 s): các bản chuẩn bị DB LẦN LƯỢT dưới khoá khởi động
      # (docker-entrypoint.sh), bản cuối chờ các bản trước. Trong start_period lần kiểm tra
      # đạt là healthy ngay — đặt dài không làm chậm bản nào, chỉ tránh báo unhealthy oan.
      start_period: 180s
    restart: unless-stopped

  ai-bot:
    image: ghcr.io/heartmindzc/ktln-getshopy-ai-bot:${IMAGE_TAG:-local}
    build:
      context: ./ktln-Getshopy/qu-n-ly-ban-l/source/ai-bot
    env_file: [.env]
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-getshopy}:${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}@postgres:5432/${POSTGRES_DB:-getshopy}"
    expose: ["3001"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  ai-rec:
    image: ghcr.io/heartmindzc/ktln-getshopy-ai-rec:${IMAGE_TAG:-local}
    build:
      context: ./ktln-Getshopy/qu-n-ly-ban-l/source/ai-rec
    environment:
      PORT: 8000
      DEFAULT_TOP_K: 10
      # Train lại mỗi ngày lúc 22:00 giờ VN (trước đây: mỗi 5 phút). Máy tắt đúng
      # giờ thì lần khởi động sau tự train bù. Để trống TRAIN_DAILY_AT -> quay về
      # chu kỳ TRAIN_INTERVAL_SECONDS (mặc định 300 s) khi cần train dày lúc dev.
      TRAIN_DAILY_AT: ${AI_REC_TRAIN_DAILY_AT-22:00}
      TRAIN_TIMEZONE: Asia/Ho_Chi_Minh
      # Lấy dữ liệu train thẳng từ ClickHouse — xem data-contract-warehouse.md §4
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${AI_REC_CH_USER:-ai_rec}
      CLICKHOUSE_PASSWORD: ${AI_REC_CH_PASSWORD:-}
      # Tín hiệu hành vi phụ khi TRAIN: none | count | dwell | dwell+cart.
      # 15/11/2026 (review merge PR #18): mặc định giữ none như config.py — benchmark
      # 30/09 cho dwell+cart NDCG -0,004 trên dữ liệu thật. Endpoint realtime-behavior
      # không cần bật mục này (đọc trọng số từ cf.behavior kể cả khi mode=none).
      CF_BEHAVIOR_MODE: ${CF_BEHAVIOR_MODE:-none}
      CF_BEHAVIOR_VIEW_WEIGHT: ${CF_BEHAVIOR_VIEW_WEIGHT:-0.25}
      CF_BEHAVIOR_CART_WEIGHT: ${CF_BEHAVIOR_CART_WEIGHT:-1.0}
      CF_BEHAVIOR_WISH_WEIGHT: ${CF_BEHAVIOR_WISH_WEIGHT:-0.5}
    expose: ["8000"]
    volumes:
      - ai_data:/app/data
      - ai_models:/app/output
    restart: unless-stopped

  # ═══ DỮ LIỆU ═════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    # wal_level=logical là điều kiện bắt buộc để Debezium tạo replication slot.
    # Thiếu thì connector báo lỗi lúc ĐĂNG KÝ, không phải lúc chạy.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-getshopy}
      POSTGRES_USER: ${POSTGRES_USER:-getshopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Thư mục trên MÁY THẬT, không phải volume. Volume bị xoá (down -v, prune,
      # nút Clean của Docker Desktop) thì bản sao lưu vẫn còn — đó mới là điểm
      # của việc sao lưu. Để trong volume khác thì cùng một lệnh xoá cả hai.
      - ./backups:/backups
    # Sao lưu tự động — lưới an toàn cho THAO TÁC TAY.
    #
    # Dữ liệu seed dựng lại được từ code (PRNG có hạt giống cố định), nhưng mọi
    # thứ bạn sửa/thêm bằng tay thì KHÔNG. Mất volume là mất hẳn phần đó.
    #
    # pg_dump chứ không phải sao chép thư mục dữ liệu: dump là SQL nên khôi phục
    # được sang máy khác kiến trúc khác, còn data dir của Postgres thì không.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.pg-backup.schedule: "@every ${PG_BACKUP_SCHEDULE:-24h}"
      ofelia.job-exec.pg-backup.command: >-
        sh -c "pg_dump -U ${POSTGRES_USER:-getshopy} -d ${POSTGRES_DB:-getshopy} -Fc --no-owner --no-acl
        > /backups/kltn-$$(date +%Y%m%d-%H%M).dump
        && ls -t /backups/kltn-*.dump | tail -n +${PG_BACKUP_KEEP:-8} | xargs -r rm -f"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Trần RAM từng truy vấn (gồm dbt) + ngưỡng tràn đĩa — đọc trong
      # local-infra-sandbox/clickhouse/users.d/memory-limits.xml
      CH_QUERY_MAX_MEMORY: ${CLICKHOUSE_QUERY_MAX_MEMORY:-2000000000}
      CH_SPILL_BYTES: ${CLICKHOUSE_SPILL_BYTES:-1000000000}
      CH_QUERY_MAX_THREADS: ${CLICKHOUSE_QUERY_MAX_THREADS:-4}
    # Trần RAM cả container (08/10/2026). Không đặt thì ClickHouse tự cho mình 90% RAM
    # CẢ máy ảo Docker, trong khi dùng chung với 12 container khác — đợt seed lớn làm máy
    # ảo cạn RAM và kernel diệt ClickHouse. Có trần thì ClickHouse tự giới hạn ở 90% mức
    # này và từ chối/tràn đĩa thay vì bị diệt. Mặc định cho Docker 7,8 GB (xem .env.example).
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-3g}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      # 9000 là cổng mặc định của cả ClickHouse TCP lẫn MinIO — đổi để khỏi đụng
      - "${CLICKHOUSE_TCP_PORT:-9010}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./ktln-Getshopy/qu-n-ly-ban-l/source/clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./scripts/ch-optimize.sh:/ch-optimize.sh:ro
      - ./local-infra-sandbox/clickhouse/users.d/memory-limits.xml:/etc/clickhouse-server/users.d/memory-limits.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Gộp phần thừa của MỌI bảng ReplacingMergeTree, chạy thưa vào lúc rảnh.
    #
    # fact_orders_detail và processed_data_for_AI_rec đều là incremental
    # append-only: mỗi lượt dbt (5 phút) ghi thêm phần mới, orders_live thì
    # nhận liên tục từ Kafka. ClickHouse tự gộp trong nền nhưng không hứa lúc
    # nào — phần thừa tích lại làm mọi truy vấn FINAL chậm dần đều.
    #
    # Script tự tìm bảng thay vì liệt kê cứng: thêm model ReplacingMergeTree
    # mới mà quên sửa chỗ này thì bảng đó tích phần thừa vô hạn, và không có
    # dấu hiệu nào ngoài việc truy vấn chậm dần.
    #
    # KHÔNG đặt OPTIMIZE vào post_hook của dbt: dbt chạy mỗi 5 phút, mà
    # OPTIMIZE FINAL đọc và ghi lại TOÀN BỘ bảng. Chạy mỗi 5 phút là dành phần
    # lớn thời gian của máy để sắp xếp lại dữ liệu vừa mới sắp xong.
    #
    # Nhãn ofelia.job-exec phải nằm trên chính container cần chạy lệnh, không
    # phải trên container scheduler.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.ch-optimize.schedule: "@every ${CH_OPTIMIZE_SCHEDULE:-1h}"
      ofelia.job-exec.ch-optimize.command: "sh /ch-optimize.sh"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose: ["6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ═══ BIGDATA — profile 'bigdata' ═════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Heap JVM — mặc định 512 MB. Một broker, vài topic: đo được 0,17 GiB.
      # JVM giữ phần heap đã chiếm chứ không trả lại, nên heap thừa là RAM mất.
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [zookeeper]
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT cho nội bộ compose, PLAINTEXT_HOST cho máy host
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Heap JVM — mặc định 1 GB, đo được 1,14 GiB (benchmark 23/10). Dữ liệu
      # topic nằm trên đĩa và page cache của hệ điều hành, heap chỉ để xử lý
      # request — một broker cỡ này không cần tới 1 GB.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    restart: unless-stopped

  kafka-connect:
    # Build thay vì mount JAR: plugin ~50MB, ghim phiên bản trong Dockerfile
    build:
      context: ./local-infra-sandbox/kafka-connect
    depends_on: [kafka]
    ports: ["${KAFKA_CONNECT_PORT:-8083}:8083"]
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Connector config đọc bí mật qua ${env:...} thay vì hardcode trong JSON
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      # Heap JVM (08/10/2026). Mặc định JVM lấy 1/4 RAM máy ảo — đo được 2,5 GB RSS và bị
      # kernel diệt 3 lần trong đợt seed lớn. S3 Sink chỉ đệm flush.size = 1000 bản ghi
      # mỗi partition nên 1 GB heap là thừa.
      KAFKA_HEAP_OPTS: ${KAFKA_CONNECT_HEAP_OPTS:--Xms256m -Xmx1g}
    mem_limit: ${KAFKA_CONNECT_MEM_LIMIT:-1536m}
    volumes:
      - ./local-infra-sandbox/config-json:/config-json:ro
    restart: unless-stopped

  minio:
    # Build từ mã nguồn, ghim RELEASE.2025-09-07T16-13-09Z: MinIO đã ngừng phát
    # image bản cộng đồng — Docker Hub lẫn quay.io đều không kéo được nữa (04/10/2026).
    # Lý do và nguồn: local-infra-sandbox/minio/Dockerfile.
    build:
      context: ./local-infra-sandbox/minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Chạy một lần sau khi các service sẵn sàng, rồi thoát.
  # Bốn việc phải đúng thứ tự và phải chờ service khác lên: tạo bucket MinIO,
  # user ClickHouse cho AI-Rec, kéo masterdata, đăng ký connector CDC. Làm tay
  # thì dễ sót bước hoặc chạy sai thứ tự, mà lỗi kiểu đó không hiện ra ngay —
  # chỉ là dữ liệu không bao giờ chảy.
  bootstrap:
    build:
      context: ./scripts/bootstrap
    command: ["/bootstrap.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-getshopy}
      POSTGRES_USER: ${POSTGRES_USER:-getshopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      MINIO_BUCKET: ${MINIO_BUCKET:-data-lake}
      AI_REC_CH_USER: ${AI_REC_CH_USER:-ai_rec}
      AI_REC_CH_PASSWORD: ${AI_REC_CH_PASSWORD:-}
      CLIENT_PORT: ${CLIENT_PORT:-3000}
    volumes:
      - ./scripts/bootstrap-bigdata.sh:/bootstrap.sh:ro
      - ./local-infra-sandbox/config-json:/config-json:ro
      - ./ktln-Getshopy/qu-n-ly-ban-l/source/clickhouse-init:/clickhouse-init:ro
      - ./scripts/etl:/etl:ro
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
      kafka-connect: {condition: service_started}
    # Chạy xong thì thoát, không dựng lại
    restart: "no"

  # dbt — CHẠY THỦ CÔNG, không có scheduler.
  #
  #   docker compose --profile dbt run --rm dbt build   # dựng toàn bộ model
  #   docker compose --profile dbt run --rm dbt test    # chạy test
  #   docker compose --profile dbt run --rm dbt run --select mart_revenue
  #
  # profile 'dbt' nên `up -d` thường không đụng tới nó.
  dbt:
    build:
      context: ./scripts/dbt
    profiles: [dbt]
    working_dir: /dbt
    volumes:
      - ./local-infra-sandbox/dbt_warehouse:/dbt
    environment:
      CH_HOST: clickhouse
      CH_PORT: 8123
      CH_USER: ${CLICKHOUSE_USER:-default}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CH_DB: default
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: ${MINIO_BUCKET:-data-lake}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-cdc_prod}
      PG_SOURCE_HOST: postgres
      PG_SOURCE_PORT: 5432
      PG_SOURCE_DB: ${POSTGRES_DB:-getshopy}
      PG_SOURCE_USER: ${POSTGRES_USER:-getshopy}
      PG_SOURCE_PASSWORD: ${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}

  # ── Seed dữ liệu — CHẠY TAY, tách khỏi `up` từ 04/10/2026 ─────────────────────
  # `up` chỉ seed nền nhẹ (tài khoản, danh mục, hãng, voucher, tài khoản test).
  # Hai bước nặng chạy khi cần; profile 'seed' nên `up -d` (kể cả --build) không đụng tới:
  #
  #   docker compose --profile seed run --rm seed-catalog   # 600k sản phẩm + tồn kho, 10–20 phút
  #   docker compose --profile seed run --rm seed-data      # bộ demo: 40k khách · 3 triệu đơn
  #   docker compose --profile seed run --rm seed-data demo_dataset.py --dry-run   # thử, KHÔNG ghi
  #   docker compose --profile seed run --rm seed-data -m unittest discover -s tests -v
  #
  # seed-data CHỈ dành cho máy demo — rất nặng, xem README §Seed dữ liệu. Cả hai chỉ cần
  # Postgres; ghi lúc cả stack đang chạy thì CDC đẩy đơn sang lake ngay khi ghi.
  seed-catalog:
    build:
      context: ./ktln-Getshopy/qu-n-ly-ban-l/source/server
    profiles: [seed]
    env_file: [.env]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-getshopy}:${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}@postgres:5432/${POSTGRES_DB:-getshopy}"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-getshopy}:${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}@postgres:5432/${POSTGRES_DB:-getshopy}"
    entrypoint: ["sh", "/app/scripts/seed-catalog.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  seed-data:
    build:
      context: ./data-platform-poc
    profiles: [seed]
    environment:
      # libpq tự đọc các biến PG* — không phải ghép chuỗi kết nối chứa mật khẩu
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-getshopy}
      PGPASSWORD: ${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}
      PGDATABASE: ${POSTGRES_DB:-getshopy}
      # Mật khẩu chung của khách demo — cùng biến với seed-demo.js; trống = 123456
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - ./data-platform-poc/out:/app/out          # manifest của lượt sinh (gitignore)
    command: ["demo_dataset.py", "--manifest", "/app/out/demo_manifest.json"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  # Scheduler gọi dbt theo lịch. Tách khỏi service `dbt` (chạy tay) để hai
  # cách dùng không giẫm chân nhau.
  #
  # ofelia đọc lịch từ label của chính nó, gọi `docker run` lên image dbt.
  # Nhẹ hơn Airflow rất nhiều — quy mô này chưa cần DAG, retry policy hay
  # backfill.
  #
  # `dbt build` chứ không `dbt run`: build = run + test, nên checksum 3 tầng
  # chạy mỗi lượt và phát hiện lệch sớm. Chạy `run` là mất dữ liệu giữa đường
  # mà không ai biết cho tới khi chạy test tay.
  dbt-scheduler:
    image: mcuadros/ofelia:latest
    depends_on:
      clickhouse: {condition: service_healthy}
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-run.dbt-build.schedule: "@every ${DBT_SCHEDULE:-5m}"
      ofelia.job-run.dbt-build.image: "kltn-dbt:latest"
      ofelia.job-run.dbt-build.network: "kltn_default"
      ofelia.job-run.dbt-build.volume: "${PWD}/local-infra-sandbox/dbt_warehouse:/dbt"
      ofelia.job-run.dbt-build.command: "build"
      # Lượt trước chưa xong thì bỏ qua lượt này. Mặc định ofelia cho chạy chồng
      # (no-overlap = false): hai lượt cùng lúc là nhân đôi phần RAM ClickHouse
      # của dbt — benchmark 23/10, B6.
      ofelia.job-run.dbt-build.no-overlap: "true"
      # ofelia đọc trường `environment` theo cú pháp MẢNG JSON. Chuỗi ngăn bằng
      # dấu phẩy được nhận nguyên khối thành MỘT biến, nên dbt báo
      # "Env var required but not provided: MINIO_ACCESS_KEY" dù nhãn có đủ giá
      # trị. Job hỏng âm thầm mỗi 5 phút — chỉ thấy khi đọc log scheduler.
      ofelia.job-run.dbt-build.environment: >-
        ["CH_HOST=clickhouse","CH_PORT=8123","CH_USER=${CLICKHOUSE_USER:-default}",
        "CH_PASSWORD=${CLICKHOUSE_PASSWORD:-}","CH_DB=default",
        "MINIO_HOST=minio","MINIO_PORT=9000","MINIO_BUCKET=${MINIO_BUCKET:-data-lake}",
        "MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}","MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}",
        "CDC_TOPIC_PREFIX=${CDC_TOPIC_PREFIX:-cdc_prod}",
        "PG_SOURCE_HOST=postgres","PG_SOURCE_PORT=5432","PG_SOURCE_DB=${POSTGRES_DB:-getshopy}",
        "PG_SOURCE_USER=${POSTGRES_USER:-getshopy}","PG_SOURCE_PASSWORD=${POSTGRES_PASSWORD:?thieu .env - xin file .env tu chu repo, dat o thu muc goc roi chay lai}"]
    restart: unless-stopped

  # ═══ GIÁM SÁT — Prometheus + Grafana (19/11/2026) ════════════════════════
  # Thấy gateway chia tải cho các bản server theo thời gian thực: request/s, độ trễ, lỗi,
  # CPU/RAM từng bản. Tài liệu, cách đọc dashboard, bảo mật: docs/monitoring.md.
  # Không nằm trong CD (deploy/cd chỉ tạo lại 4 service ứng dụng) — bật / cập nhật bằng tay:
  #   docker compose up -d prometheus grafana
  # Không có cổng nào ra ngoài trừ Grafana trên loopback.

  prometheus:
    # 3.13 là bản LTS của Prometheus; 3.13.5 (21/10/2026) gồm các bản vá bảo mật.
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Giữ dữ liệu theo THỜI GIAN và theo DUNG LƯỢNG — chạm mức nào trước thì xoá block cũ
      # trước. Ổ D: chật (từng đầy, sập production 15/11): trần dung lượng là bắt buộc.
      # https://prometheus.io/docs/prometheus/latest/storage/#operational-aspects
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # Không publish cổng: chỉ Grafana (cùng network) đọc. Xem target / chạy truy vấn khi cần:
    #   docker compose exec prometheus wget -qO- http://localhost:9090/api/v1/targets
    # hoặc dùng Explore của Grafana.
    expose: ["9090"]
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    depends_on: [prometheus]
    ports:
      # CHỈ loopback: Grafana có trang đăng nhập admin, không đưa ra LAN / Funnel. Xem từ máy
      # khác trong tailnet: `tailscale serve` (KHÔNG phải funnel) — docs/monitoring.md.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # ĐẶT GRAFANA_ADMIN_PASSWORD trong .env TRƯỚC lần khởi động đầu: Grafana chỉ đọc biến này
      # khi tạo tài khoản admin lần đầu (volume grafana_data còn trống); đổi sau đó phải dùng
      #   docker compose exec grafana grafana cli admin reset-admin-password <mật-khẩu-mới>
      # Cố ý KHÔNG dùng ${VAR:?}: CD chạy `docker compose config/up` với .env production, thiếu
      # biến bắt buộc là hỏng mọi lần deploy. Thiếu biến -> "admin" = mặc định của Grafana, lần
      # đăng nhập đầu Grafana đòi đổi mật khẩu; cổng chỉ nghe loopback.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Không gọi ra Internet: không báo số liệu sử dụng, không kiểm tra bản mới, không tự cài
      # plugin lúc khởi động (máy production dùng chung, mạng ra ngoài không cần thiết).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Grafana 13 chạy MỖI datasource đóng gói sẵn thành một tiến trình riêng (~25 MB RSS mỗi cái,
      # đo 19/11/2026). Chỉ cần Prometheus và Loki -> không nạp 11 datasource còn lại.
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
      # ── Cảnh báo qua email (monitoring/grafana/provisioning/alerting/, docs/monitoring.md) ──
      # Dùng LẠI máy gửi của chức năng "Quên mật khẩu" (SMTP_* trong .env). Grafana tự dùng TLS
      # ngay từ đầu khi cổng là 465 (như SMTP_SECURE=true), cổng khác thì STARTTLS — bắt buộc
      # (MandatoryStartTLS) để mật khẩu không bao giờ đi dạng chữ thường, như server.
      # Biến thiếu chỉ làm email không gửi được (Grafana ghi lỗi), KHÔNG làm compose / CD dừng.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-localhost}:${SMTP_PORT:-587}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASS:-}
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # Địa chỉ gửi (chỉ địa chỉ, không tên) và nhận cảnh báo — đặt trong .env:
      #   ALERT_EMAIL_FROM=<địa chỉ gửi, Gmail: chính SMTP_USER>  ALERT_EMAIL_TO=<hộp thư nhận>
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL_FROM:-}
      GF_SMTP_FROM_NAME: Getshopy Giám sát
      # Link trong email (Grafana mặc định ghi http://localhost:3000/ — cổng trong container).
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}/
      # KHÔNG để trống: contact point không có địa chỉ thì Grafana KHÔNG khởi động được (đã thử).
      # Chưa đặt -> địa chỉ .invalid (RFC 2606, không ai nhận): Grafana vẫn chạy, chỉ ghi lỗi gửi mail.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-chua-dat-ALERT_EMAIL_TO@example.invalid}
      # Mở Grafana là vào thẳng dashboard cân bằng tải
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/getshopy/getshopy-load-balancing.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards/getshopy:ro
      - grafana_data:/var/lib/grafana
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    restart: unless-stopped

  # Thăm dò HTTP từ bên ngoài server (monitoring/blackbox/blackbox.yml): /api/health của từng bản,
  # qua gateway, URL public. Đầu vào của cảnh báo "Server treo" / "Web sập". Không publish cổng.
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    expose: ["9115"]
    mem_limit: ${BLACKBOX_MEM_LIMIT:-64m}
    restart: unless-stopped

  # ── Log tập trung: Loki (kho) + Alloy (gom) + health-events (sự kiện container) ──
  # docs/monitoring.md, mục "Log tập trung". Không cổng nào ra ngoài; xem log trong Grafana.
  loki:
    # 3.7 là nhánh ổn định hiện hành; 3.7.9 (20/10/2026).
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki_data:/loki
    expose: ["3100"]
    mem_limit: ${LOKI_MEM_LIMIT:-512m}
    restart: unless-stopped

  # Đọc stdout của ĐÚNG 3 service (server, gateway, health-events) của project này, lọc + gắn nhãn,
  # đẩy về Loki (monitoring/alloy/config.alloy). Cần docker.sock: ":ro" KHÔNG làm API thành chỉ
  # đọc — tiến trình có quyền này coi như root trên máy ảo Docker (như dbt-scheduler đang có).
  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-kltn}
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Vị trí đã đọc tới trong log mỗi container: khởi động lại Alloy không gửi trùng.
      - alloy_data:/var/lib/alloy/data
    depends_on: [loki]
    mem_limit: ${ALLOY_MEM_LIMIT:-256m}
    restart: unless-stopped

  # Sự kiện vòng đời / health của server và gateway (die + mã thoát, start, kill, oom, healthy,
  # unhealthy...) thành dòng JSON trên stdout -> Alloy -> Loki (monitoring/health-events/events.sh).
  health-events:
    image: docker:28.4.0-cli
    entrypoint: ["sh", "/events.sh"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-kltn}
    volumes:
      - ./monitoring/health-events/events.sh:/events.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # tini làm PID 1: chuyển SIGTERM cho script khi dừng (sh làm PID 1 thì bỏ qua SIGTERM).
    init: true
    mem_limit: 64m
    restart: unless-stopped

  # ═══ GATEWAY ═════════════════════════════════════════════════════════════

  # Một cổng vào cho web, server, ai-rec và ai-bot, chia theo đường dẫn — bảng
  # route ở gateway/nginx.conf. server, ai-rec và ai-bot chỉ `expose` trong
  # network nên máy khác không gọi thẳng được; gateway là đường vào của chúng.
  #
  # Mặc định chỉ nghe localhost. Để các máy cùng tailnet Tailscale gọi được,
  # đặt GATEWAY_BIND_IP trong .env bằng IP Tailscale của máy (tailscale ip -4),
  # rồi gọi qua tên MagicDNS:  http://<tên-máy>.<tailnet>.ts.net:8000/
  #
  # KHÔNG đặt 0.0.0.0: ai-rec và ai-bot chưa có xác thực (/api/b2b có requireAdmin
  # từ 11/11/2026, nhưng vẫn không nên mở thừa), và rule
  # firewall "Docker Desktop Backend" cho mọi cổng Docker publish đi vào ở cả
  # mạng Public — nghe mọi IP là lộ các API đó ra cả mạng LAN đang cắm.
  gateway:
    # Ghim bản vá (18/11/2026): upstream `server ... resolve` trong gateway/nginx.conf cần nginx
    # >= 1.27.3. Tag 1.27-alpine trôi theo bản 1.27 mới nhất, nhưng máy nào còn image 1.27-alpine
    # kéo từ trước 1.27.3 thì gateway không khởi động được.
    image: nginx:1.27.5-alpine
    ports:
      # HTTP trực tiếp — gọi API bằng Postman, curl.
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8000}:80"
      # Đích cho `tailscale serve` (HTTPS trong tailnet). Mở web trên trình duyệt
      # PHẢI đi đường HTTPS: useTracking gọi crypto.randomUUID(), hàm chỉ có ở
      # secure context, nên qua HTTP thường trang trắng. Hai cổng nằm trên
      # loopback vì dịch vụ Tailscale không gọi được vào chính IP Tailscale của
      # máy (502 sau ~20 s). Dựng trên máy demo, một lần (cấu hình được lưu lại):
      #   tailscale serve --bg --https=443  http://127.0.0.1:18000   # web + API
      #   tailscale serve --bg --https=8080 http://127.0.0.1:18081   # WebSocket dashboard
      - "127.0.0.1:${GATEWAY_SERVE_PORT:-18000}:80"
      - "127.0.0.1:${GATEWAY_SERVE_WS_PORT:-18081}:8081"
      # Cổng PUBLIC (server listen 8090 trong gateway/nginx.conf): chỉ cửa hàng,
      # chặn mặc định mọi thứ khác. CHỈ trên loopback — Internet tới qua Funnel /
      # tunnel trỏ vào đây, không mở cổng nào của máy:
      #   tailscale funnel --bg --https=443 http://127.0.0.1:18090
      # (khi đó admin chuyển sang cổng tailnet khác, ví dụ --https=4443 -> 18000)
      - "127.0.0.1:${GATEWAY_PUBLIC_PORT:-18090}:8090"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Trang "đang bảo trì" khi dịch vụ phía sau không trả lời (error_page trong nginx.conf)
      - ./gateway/maintenance.html:/usr/share/nginx/maintenance/maintenance.html:ro
    restart: unless-stopped

